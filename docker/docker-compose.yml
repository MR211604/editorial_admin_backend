version: '3.8'

services:
  app:
    build:
      context: .
      secrets:
        - gh_token
    ports:
      - "8080:80"
    depends_on:
      - db
    volumes:
      - ../../editorial_admin_backend:/var/www/html
  db:
    image: mysql:5.7.29
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: editorial_udb
    volumes:
      - db_data:/var/lib/mysql

secrets:
  gh_token:
    environment: GH_TOKEN
volumes:
  db_data:
