version: '3.8'

services:
  app:
    build:
      context: .
    ports:
      - "8080:80"
    depends_on:
      - db
  db:
    image: mysql:5.7.29
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: editorial_udb
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: